<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Certificações & Credentials | Cybersecurity</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            dark: '#0a0f1d',
                            card: '#111827',
                            border: '#1f293d',
                            accent: '#06b6d4',
                            purple: '#a855f7',
                            green: '#10b981',
                            red: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #070a13;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .glow-accent {
            box-shadow: 0 0 20px -5px rgba(6, 182, 212, 0.3);
        }
        .glow-accent:hover {
            box-shadow: 0 0 25px 0px rgba(6, 182, 212, 0.5);
        }
        .badge-glow {
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
        }
        .cert-card.has-pdf {
            cursor: pointer;
        }
        .badge-img-wrap {
            width: 3rem;
            height: 3rem;
            border-radius: 9999px;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1e2440 0%, #0a0f1d 100%);
            border: 1px solid rgba(168, 85, 247, 0.4);
            flex-shrink: 0;
            position: relative;
        }
        .badge-img-wrap img {
            width: 110%;
            height: 110%;
            object-fit: contain;
            display: block;
            transform: translateZ(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Banner -->
<header class="border-b border-cyber-border bg-cyber-dark/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col lg:flex-row justify-between lg:items-center gap-6">

        <!-- Left -->
        <div class="flex items-start gap-4">

            <div class="p-3 bg-cyan-950/80 border border-cyan-500/30 rounded-xl text-cyan-400 flex-shrink-0">
                <i class="fa-solid fa-shield-halved text-3xl"></i>
            </div>

            <div>

                <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-white">
                    Rivelino Sampaio
                </h1>

                <p class="mt-1 text-cyan-400 font-medium text-sm md:text-base">
                    Analista de Cibersegurança • Pentest • CTF Player
                </p>

                <p class="mt-3 max-w-3xl text-sm text-slate-400 leading-relaxed">
                    Segurança Ofensiva é o foco, mas transito bem por Defensiva, Threat Intelligence e GRC. Aprendizado contínuo via certificações, CTFs e laboratórios práticos.
                </p>

            </div>

        </div>

        <!-- Right -->
        <div id="social-links" class="flex items-center gap-3 flex-wrap"></div>

    </div>
</header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Filters Section -->
        <div class="mb-8 flex flex-wrap gap-2 items-center justify-center sm:justify-start">
            <button onclick="filterCategory('all')" class="filter-btn active px-4 py-2 rounded-lg text-xs font-semibold border border-cyan-500/50 bg-cyan-500/10 text-cyan-400 transition" data-cat="all">
                <i class="fa-solid fa-border-all mr-1.5"></i> Todas (<span id="count-all">0</span>)
            </button>
            <button onclick="filterCategory('offensive-security')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="offensive-security">
                <i class="fa-solid fa-terminal mr-1.5 text-red-400"></i> Offensive Security
            </button>
            <button onclick="filterCategory('defensive-security')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="defensive-security">
                <i class="fa-solid fa-shield-halved mr-1.5 text-emerald-400"></i> Defensive Security
            </button>
            <button onclick="filterCategory('threat-intelligence')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="threat-intelligence">
                <i class="fa-solid fa-bug mr-1.5 text-purple-400"></i> Threat Intelligence
            </button>
            <button onclick="filterCategory('malware-reverse-engineering')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="malware-reverse-engineering">
                <i class="fa-solid fa-microchip mr-1.5 text-fuchsia-400"></i> Malware & Reverse Engineering
            </button>
            <button onclick="filterCategory('governance-risk-compliance')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="governance-risk-compliance">
                <i class="fa-solid fa-file-contract mr-1.5 text-blue-400"></i> Governance, Risk & Compliance (GRC)
            </button>
            <button onclick="filterCategory('badges')" class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold border border-slate-800 bg-slate-900/80 text-slate-400 hover:text-white transition" data-cat="badges">
                <i class="fa-solid fa-ribbon mr-1.5 text-amber-400"></i> Badges
            </button>
        </div>

        <!-- Credentials Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cert-grid"></div>
    </main>

    <footer class="border-t border-cyber-border bg-cyber-dark py-6 mt-12 text-center text-xs text-slate-500">
        <p>© 2026 • Portfólio de Segurança da Informação. Rivelino Sampaio.</p>
    </footer>

    <script src="certifications.js"></script>
</body>
</html>
